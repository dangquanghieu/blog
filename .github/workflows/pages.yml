# Build Jekyll và deploy lên GitHub Pages mỗi lần push vào nhánh main.
# Cần bật: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      # url/baseurl lấy từ cấu hình Pages của repo:
      #   có custom domain (blog.dangquanghieu.com) → baseurl rỗng
      #   không gắn domain (repo "blog")            → dangquanghieu.com/blog
      - name: Build
        run: |
          printf 'url: "%s"\nbaseurl: "%s"\n' \
            "${{ steps.pages.outputs.origin }}" "${{ steps.pages.outputs.base_path }}" > _config_ci.yml
          bundle exec jekyll build --config _config.yml,_config_ci.yml
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
