# ─────────────────────────────────────────────────────────────
#  Đen và Trắng — cấu hình site
#  Lưu ý: sửa file này khi đang chạy `jekyll serve` thì phải
#  dừng (Ctrl-C) và chạy lại mới thấy thay đổi.
# ─────────────────────────────────────────────────────────────

title: Đen và Trắng
description: Ghi chép về ánh sáng, bóng đêm, và những thứ khác.
author: Đặng Quang Hiếu          # tên hiện ở footer và trong thẻ meta
lang: vi
timezone: Asia/Ho_Chi_Minh

# url/baseurl chỉ dùng khi chạy trên máy. Khi deploy, GitHub Actions
# tự ghi đè hai giá trị này theo cấu hình Pages của repo
# (subdomain → baseurl rỗng; không gắn domain → baseurl "/<tên-repo>").
url: "http://localhost:4000"
baseurl: ""

# Liên kết ở footer (để trống thì không hiện)
main_site: https://dangquanghieu.com
flickr: "https://flickr.com/photos/fridaycafe/"                       # ví dụ https://www.flickr.com/photos/<username>/

# Bình luận tự dựng trên Cloudflare (xem comments-worker/README.md).
# Điền `api` để bật; khi có `api`, giscus bên dưới bị bỏ qua.
comments:
  api: "https://den-va-trang-comments.dangquanghieu.workers.dev"
  turnstile_sitekey: "0x4AAAAAAFqqqLKuMjkrTkSy"   # Site key của widget Turnstile (công khai)

# Bình luận bằng giscus (https://giscus.app). Điền đủ 4 giá trị để bật.
giscus:
  repo: ""                       # ví dụ dangquanghieu/blog
  repo_id: ""
  category: ""
  category_id: ""

permalink: /:year/:month/:title/

# Trang chủ: số bài mới nhất hiển thị
home_posts: 7

# Trang Ghi chép (/ghi-chep/): số bài mỗi trang, đường dẫn các trang sau
paginate: 20
paginate_path: "/ghi-chep/trang/:num/"

# Bài trong _posts/ tự dùng layout "post" (không cần ghi trong front matter)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - _config_ci.yml
  - comments-worker
  - node_modules
